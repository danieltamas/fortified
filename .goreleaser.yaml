version: 2

project_name: fortified

before:
  hooks:
    - go mod tidy

builds:
  - id: fortified
    main: ./cmd/fortified
    binary: fortified
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: fortified
    ids: [fortified]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: danieltamas
    name: fortified
  header: |
    See the [command reference](https://github.com/danieltamas/fortified#commands) for what's new.
